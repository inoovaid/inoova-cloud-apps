    release: prometheus-stack
spec:
  namespaceSelector:
    matchNames: [gitlab]
  selector:
    matchLabels:
      app: sidekiq
      release: gitlab
  podMetricsEndpoints:
    - port: http-metrics
      path: /metrics
      interval: 30s
