# GitLab CE via ArgoCD (gitlab/application.yaml)
# Chart: gitlab/gitlab 10.2.1 (charts.gitlab.io) — app v19.2.1
# Adaptacoes ao chart 10.x em relacao ao plano: Redis externo obrigatorio
# (chart >= v10 removeu subcharts bundled), ingress classico via global.ingress,
# MinIO por feature via global.appConfig (object_store.enabled=false).

global:
  edition: ce
  gitlabVersion: "19.2.1"

  hosts:
    domain: gitlab-cloud.dnn.lat
    https: true
    gitlab:
      name: gitlab-cloud.dnn.lat

  gatewayApi:
    enabled: false
    installEnvoy: false

  ingress:
    enabled: true
    provider: nginx
    class: nginx
    apiVersion: networking.k8s.io/v1
    configureCertmanager: false
    tls:
      enabled: true
      secretName: wildcard-dnn

  monitoring:
    enabled: true

  kas:
    enabled: false

  psql:
    host: postgres-ha-rw.default.svc.cluster.local
    port: 5432
    username: appuser
    database: gitlabhq_production
    password:
      secret: gitlab-postgresql
      key: password

  redis:
    host: gitlab-redis.gitlab.svc.cluster.local
    port: 6379
    auth:
      enabled: true
      secret: gitlab-redis
      key: redis-password

  appConfig:
    object_store:
      enabled: false
    lfs:
      enabled: true
      bucket: lfs
      connection:
        secret: gitlab-s3-credentials
        key: connection
    artifacts:
      enabled: true
      bucket: artifacts
      connection:
        secret: gitlab-s3-credentials
        key: connection
    uploads:
      enabled: true
      bucket: uploads
      connection:
        secret: gitlab-s3-credentials
        key: connection
    packages:
      enabled: true
      bucket: packages
      connection:
        secret: gitlab-s3-credentials
        key: connection
    externalDiffs:
      enabled: true
      bucket: external-diffs
      connection:
        secret: gitlab-s3-credentials
        key: connection
    terraformState:
      enabled: true
      bucket: terraform-state
      connection:
        secret: gitlab-s3-credentials
        key: connection
    ciSecureFiles:
      enabled: true
      bucket: ci-secure-files
      connection:
        secret: gitlab-s3-credentials
        key: connection

installCertmanager: false

certmanager-issuer:
  email: admin@dnn.lat

prometheus:
  install: false

gitlab-runner:
  install: false

nginx-ingress:
  enabled: false

haproxy:
  install: false

traefik:
  install: false

gitlab-zoekt:
  install: false

openbao:
  install: false

ai-gateway:
  install: false

registry:
  enabled: false

gitlab:

  webservice:
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: 2000m
        memory: 2Gi
    metrics:
      serviceMonitor:
        enabled: true

  sidekiq:
    resources:
      requests:
        cpu: 250m
        memory: 600Mi
      limits:
        cpu: 1000m
        memory: 1Gi
    metrics:
      podMonitor:
        enabled: true

  gitaly:
    persistence:
      size: 40Gi
    resources:
      requests:
        cpu: 250m
        memory: 1Gi
      limits:
        cpu: 1000m
        memory: 1500Mi
    metrics:
      serviceMonitor:
        enabled: true

  gitlab-shell:
    minReplicas: 1
    maxReplicas: 2
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

  toolbox:
    backups:
      cron:
        enabled: false
      objectStorage:
        config:
          secret: gitlab-s3-credentials
          key: connection
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi

  migrations:
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

  gitlab-exporter:
    metrics:
      serviceMonitor:
        enabled: true

# Fresh install (banco novo, sem release anterior): o hook pre-upgrade
# upgradeCheck falha porque o ConfigMap gitlab-gitlab-chart-info nao existe.
# Reativar antes de upgrades futuros.
upgradeCheck:
  enabled: false
