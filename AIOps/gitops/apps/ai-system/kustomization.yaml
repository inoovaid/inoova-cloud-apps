resources:
  - ollama-paperclip/service.yaml
  - serviceaccount.yaml
  - clusterrole.yaml
  - clusterrolebinding.yaml
  - ollama/ollama.yaml
  - ollama-agents/ollama-agents.yaml
  - mcp-servers/kubernetes/base
  - kagent
  - redis
  - langgraph

patches:
  - path: patches/ollama-paperclip-label.yaml
    target:
      kind: Deployment
      name: ollama
  - path: patches/ollama-agents-paperclip-label.yaml
    target:
      kind: Deployment
      name: ollama-agents
