apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-agent
  namespace: ai-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mcp-kubernetes-admin-binding
subjects:
  - kind: ServiceAccount
    name: ai-agent
    namespace: ai-system
roleRef:
  kind: ClusterRole
  name: cluster-admin # Dando acesso total para garantir que funcione de primeira.
  apiGroup: rbac.authorization.k8s.io
