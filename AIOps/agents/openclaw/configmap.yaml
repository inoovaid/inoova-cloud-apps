apiVersion: v1
kind: ConfigMap
metadata:
  name: openclaw-config
  namespace: openclaw
  labels:
    app: openclaw
    app.kubernetes.io/instance: openclaw
data:
  openclaw.json: |
    {
      "plugins": {
        "entries": {
          "ollama": {
            "enabled": true,
            "config": {}
          }
        }
      },
      "gateway": {
        "mode": "local",
        "auth": {
          "mode": "token",
          "token": "96a05fc16a428fdb389edd73713c541316992ca860d9d864"
        },
        "port": 18789,
        "bind": "lan",
        "trustedProxies": [
          "10.0.0.0/8",
          "192.168.0.0/16",
          "172.16.0.0/12"
        ],
        "controlUi": {
          "allowedOrigins": [
            "https://openclaw.dnn.lat",
            "http://openclaw.dnn.lat"
          ]
        }
      },
      "agents": {
        "defaults": {
          "workspace": "/home/node/.openclaw/workspace",
          "model": {
            "default": "ollama-coder/qwen2.5:14b-instruct-q4_K_M",
            "fallbacks": [
              "ollama-general/llama3.1:8b-instruct-q5_K_M"
            ]
          },
          "memorySearch": {
            "enabled": false
          }
        }
      },
      "mcp": {
        "servers": {
          "kubernetes": {
            "transport": "streamable-http",
            "url": "http://mcp-kubernetes.ai-system.svc.cluster.local:8000/mcp",
            "headers": {
              "Accept": "application/json, text/event-stream"
            },
            "connectionTimeoutMs": 15000
          }
        }
      },
      "models": {
        "mode": "merge",
        "providers": {
          "ollama-coder": {
            "api": "ollama",
            "baseUrl": "http://ollama.ai-system.svc.cluster.local:11434",
            "apiKey": "ollama-local",
            "models": [
              {
                "id": "qwen2.5:14b-instruct-q4_K_M",
                "name": "Qwen2.5 14B Instruct (inst.1 - tools)",
                "api": "ollama",
                "contextWindow": 32768,
                "maxTokens": 4096,
                "params": {
                  "num_ctx": 32768
                }
              }
            ]
          },
          "ollama-general": {
            "api": "ollama",
            "baseUrl": "http://ollama-agents.ai-system.svc.cluster.local:11434",
            "apiKey": "ollama-local",
            "models": [
              {
                "id": "llama3.1:8b-instruct-q5_K_M",
                "name": "Llama 3.1 8B Instruct (inst.2 - fallback tools)",
                "api": "ollama",
                "contextWindow": 32768,
                "maxTokens": 4096,
                "params": {
                  "num_ctx": 32768
                }
              }
            ]
          }
        }
      }
    }
