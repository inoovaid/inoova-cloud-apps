apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: paperclip
  namespace: paperclip
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - paperclip.dnn.lat        # 👈 novo domínio
      secretName: paperclip-dnn-tls # 👈 novo secret de cert (ver passo 3)
  rules:
    - host: paperclip.dnn.lat       # 👈 novo domínio
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: paperclip
                port:
                  number: 3100      # 👈 porta corrigida
