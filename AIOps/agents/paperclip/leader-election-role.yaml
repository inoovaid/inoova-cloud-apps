# leader-election-role.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: paperclip-leader-election-role
  namespace: paperclip-operator-system
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
# leader-election-rolebinding.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: paperclip-leader-election-rolebinding
  namespace: paperclip-operator-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: paperclip-leader-election-role
subjects:
  - kind: ServiceAccount
    name: paperclip-operator
    namespace: paperclip-operator-system
