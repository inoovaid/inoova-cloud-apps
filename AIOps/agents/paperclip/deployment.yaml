apiVersion: apps/v1
kind: Deployment
metadata:
  name: paperclip
  namespace: paperclip
  labels:
    app: paperclip
spec:
  replicas: 1
  selector:
    matchLabels:
      app: paperclip
  template:
    metadata:
      labels:
        app: paperclip
    spec:
      containers:
        - name: paperclip
          image: ghcr.io/inoovaid/paperclip:latest   # 🔧 AJUSTAR imagem/tag
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080                      # 🔧 AJUSTAR porta da app
          envFrom:
            - secretRef:
                name: paperclip-secrets                # 🔧 nome do sealed-secret descriptografado
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /healthz                           # 🔧 AJUSTAR se houver
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /healthz                           # 🔧 AJUSTAR
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: paperclip
  namespace: paperclip
  labels:
    app: paperclip
spec:
  selector:
    app: paperclip
  ports:
    - name: http
      port: 80
      targetPort: http
