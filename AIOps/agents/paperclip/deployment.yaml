apiVersion: apps/v1
kind: Deployment
metadata:
  name: paperclip
  namespace: paperclip
  labels:
    app: paperclip
spec:
  replicas: 1
  selector:
    matchLabels:
      app: paperclip
  template:
    metadata:
      labels:
        app: paperclip
    spec:
      containers:
        - name: paperclip
          image: ghcr.io/inoovaid/paperclip:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3100          # ✅ porta real da app
          env:
            - name: PAPERCLIP_ALLOWED_HOSTNAMES
              value: "localhost,127.0.0.1,paperclip,paperclip.paperclip,paperclip.paperclip.svc,paperclip.paperclip.svc.cluster.local,paperclip.dnn.lat"   # ✅ ADICIONADO paperclip.dnn.lat
          envFrom:
            - secretRef:
                name: paperclip-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /api/health            # ✅ endpoint real (visto no log)
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /api/health            # ✅ endpoint real
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: paperclip
  namespace: paperclip
  labels:
    app: paperclip
spec:
  selector:
    app: paperclip
  ports:
    - name: http
      port: 80
      targetPort: http     # ✅ aponta pra porta nomeada "http" (3100)
