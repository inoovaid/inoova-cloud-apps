apiVersion: paperclip.inc/v1alpha1
kind: Instance
metadata:
  name: paperclip
  namespace: paperclip
  labels:
    app.kubernetes.io/instance: paperclip
spec:
  image:
    tag: latest
  deployment:
    mode: authenticated
    exposure: public          # ✅ habilita acesso externo
  publicURL: https://paperclip.dnn.lat   # ✅ URL pública (obrigatória com exposure=public)
  allowedHostnames:           # ✅ CORS (mantém, é útil)
    - paperclip.dnn.lat
  database:
    mode: managed
  auth:
    secretRef:
      name: paperclip-auth
      key: BETTER_AUTH_SECRET
  adapters:
    apiKeysSecretRef:
      name: paperclip-api-keys
  storage:
    persistence:
      enabled: true
      size: 5Gi
